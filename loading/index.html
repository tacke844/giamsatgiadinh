<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Loading...</title>
</head>
<body class="flex items-center justify-center h-screen" style="background-image: url('../images/bg1.jpg'); background-size: cover; background-position: center;">
    <div class="bg-white p-8 rounded-lg shadow-lg text-center w-96">
        <h2 class="text-xl font-bold mb-4">Hệ thống đang xử lý, vui lòng chờ trong giây lát</h2>
        <div id="countdown" class="text-4xl font-mono font-bold text-blue-600">
            05:00:00
        </div>
    </div>

    <!-- Modal -->
    <div id="successModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-6 rounded-lg shadow-lg text-center w-80">
            <svg class="mx-auto mb-4 text-green-500" xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 8 0a8 8 0 0 1 8 8zM6.5 11.5 12 6l-1-1-4.5 4.5L3 7l-1 1 3.5 3.5z"/>
            </svg>
            <p class="text-lg font-semibold">Phần mềm đã kích hoạt thành công , vui lòng liên hệ bộ phận an ninh để sử dụng</p>
        </div>
    </div>

    <script>
        function startCountdown(duration) {
            let startTime = Date.now();
            let interval = setInterval(() => {
                let elapsed = Date.now() - startTime;
                let remaining = duration - elapsed;

                if (remaining <= 0) {
                    clearInterval(interval);
                    document.getElementById("countdown").textContent = "00:00:00";
                    document.getElementById("successModal").classList.remove("hidden"); // Hiện modal
                    return;
                }

                let minutes = Math.floor(remaining / 60000);
                let seconds = Math.floor((remaining % 60000) / 1000);
                let centiseconds = Math.floor((remaining % 1000) / 10); // Chỉ lấy 2 chữ số

                document.getElementById("countdown").textContent =
                    String(minutes).padStart(2, '0') + ":" +
                    String(seconds).padStart(2, '0') + ":" +
                    String(centiseconds).padStart(2, '0');

            }, 10); // Cập nhật mỗi 10ms
        }

        startCountdown(5 * 60 * 1000); // 5 phút
        // startCountdown(5 * 1000); // 5 phút
    </script>
</body>
</html>
